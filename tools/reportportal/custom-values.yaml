# Reduce resource requests to fit on small nodes
opensearch:
  master:
    resources:
      requests:
        cpu: "500m"
        memory: "512Mi"
      limits:
        cpu: "1"
        memory: "1Gi"

serviceapi:
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"

uat:
  resources:
    requests:
      cpu: "50m"
      memory: "256Mi"
    limits:
      cpu: "250m"
      memory: "512Mi"

analyzer:
  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
